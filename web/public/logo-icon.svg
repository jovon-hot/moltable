<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <!-- Connecting lines from central hex to outer nodes -->
  <line x1="100" y1="50" x2="100" y2="20" stroke="white" stroke-width="2.5" stroke-opacity="0.9"/>
  <line x1="158" y1="85" x2="183" y2="68" stroke="white" stroke-width="2.5" stroke-opacity="0.9"/>
  <line x1="158" y1="135" x2="183" y2="152" stroke="white" stroke-width="2.5" stroke-opacity="0.9"/>
  <line x1="100" y1="170" x2="100" y2="200" stroke="white" stroke-width="2.5" stroke-opacity="0.9"/>
  <line x1="42" y1="135" x2="17" y2="152" stroke="white" stroke-width="2.5" stroke-opacity="0.9"/>
  <line x1="42" y1="85" x2="17" y2="68" stroke="white" stroke-width="2.5" stroke-opacity="0.9"/>

  <!-- Central hex ring -->
  <polygon points="100,50 158,85 158,135 100,170 42,135 42,85" fill="none" stroke="white" stroke-width="3" stroke-opacity="0.9"/>

  <!-- Inner connecting lines (star pattern) -->
  <line x1="100" y1="50" x2="100" y2="170" stroke="white" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="42" y1="85" x2="158" y2="135" stroke="white" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="158" y1="85" x2="42" y2="135" stroke="white" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Center point -->
  <circle cx="100" cy="110" r="5" fill="url(#grad)"/>
  <circle cx="100" cy="110" r="2" fill="white"/>

  <!-- Outer nodes -->
  <circle cx="100" cy="20" r="6" fill="none" stroke="white" stroke-width="2.5"/>
  <circle cx="183" cy="68" r="6" fill="none" stroke="white" stroke-width="2.5"/>
  <circle cx="183" cy="152" r="6" fill="none" stroke="white" stroke-width="2.5"/>
  <circle cx="100" cy="200" r="6" fill="none" stroke="white" stroke-width="2.5"/>
  <circle cx="17" cy="152" r="6" fill="none" stroke="white" stroke-width="2.5"/>
  <circle cx="17" cy="68" r="6" fill="none" stroke="white" stroke-width="2.5"/>

  <!-- Inner nodes (on hex vertices) -->
  <circle cx="100" cy="50" r="4" fill="white"/>
  <circle cx="158" cy="85" r="4" fill="white"/>
  <circle cx="158" cy="135" r="4" fill="white"/>
  <circle cx="100" cy="170" r="4" fill="white"/>
  <circle cx="42" cy="135" r="4" fill="white"/>
  <circle cx="42" cy="85" r="4" fill="white"/>
</svg>
