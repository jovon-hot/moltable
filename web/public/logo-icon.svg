<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="base-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- ===== Top node ===== -->
  <circle cx="100" cy="22" r="7" fill="none" stroke="white" stroke-width="3.5"/>

  <!-- ===== Top-left node ===== -->
  <circle cx="28" cy="72" r="7" fill="none" stroke="white" stroke-width="3.5"/>

  <!-- ===== Top-right node ===== -->
  <circle cx="172" cy="72" r="7" fill="none" stroke="white" stroke-width="3.5"/>

  <!-- ===== Mid-left node ===== -->
  <circle cx="28" cy="132" r="7" fill="none" stroke="white" stroke-width="3.5"/>

  <!-- ===== Mid-right node ===== -->
  <circle cx="172" cy="132" r="7" fill="none" stroke="white" stroke-width="3.5"/>

  <!-- ===== Bottom node ===== -->
  <circle cx="100" cy="155" r="7" fill="none" stroke="white" stroke-width="3.5"/>

  <!-- ===== Connecting lines: outer to hex ===== -->
  <line x1="100" y1="22" x2="100" y2="55" stroke="white" stroke-width="3"/>
  <line x1="28" y1="72" x2="55" y2="88" stroke="white" stroke-width="3"/>
  <line x1="172" y1="72" x2="145" y2="88" stroke="white" stroke-width="3"/>
  <line x1="28" y1="132" x2="55" y2="116" stroke="white" stroke-width="3"/>
  <line x1="172" y1="132" x2="145" y2="116" stroke="white" stroke-width="3"/>
  <line x1="100" y1="155" x2="100" y2="130" stroke="white" stroke-width="3"/>

  <!-- ===== Central hexagon ===== -->
  <polygon points="100,55 145,88 145,116 100,130 55,116 55,88"
           fill="none" stroke="white" stroke-width="3.5"/>

  <!-- ===== Inner star/diamond (cross-diagonal lines) ===== -->
  <line x1="100" y1="55" x2="100" y2="130" stroke="white" stroke-width="1.8" stroke-opacity="0.5"/>
  <line x1="55" y1="88" x2="145" y2="116" stroke="white" stroke-width="1.8" stroke-opacity="0.5"/>
  <line x1="145" y1="88" x2="55" y2="116" stroke="white" stroke-width="1.8" stroke-opacity="0.5"/>

  <!-- ===== Center gradient dot ===== -->
  <circle cx="100" cy="92.5" r="5" fill="url(#grad)"/>
  <circle cx="100" cy="92.5" r="2.5" fill="white"/>

  <!-- ===== Hex vertex inner dots ===== -->
  <circle cx="100" cy="55" r="4" fill="white"/>
  <circle cx="145" cy="88" r="4" fill="white"/>
  <circle cx="145" cy="116" r="4" fill="white"/>
  <circle cx="100" cy="130" r="4" fill="white"/>
  <circle cx="55" cy="116" r="4" fill="white"/>
  <circle cx="55" cy="88" r="4" fill="white"/>

  <!-- ===== Horizontal base diamond/bar at bottom ===== -->
  <polygon points="100,170 145,178 100,186 55,178"
           fill="url(#base-grad)" fill-opacity="0.95" stroke="white" stroke-width="2"/>
</svg>
