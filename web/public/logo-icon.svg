<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <radialGradient id="glow" cx="100" cy="136" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Glow -->
  <circle cx="100" cy="136" r="80" fill="url(#glow)"/>

  <!-- Bonds — thick white/purple -->
  <line x1="46" y1="162" x2="72" y2="136" stroke="white" stroke-width="3" stroke-opacity="0.75"/>
  <line x1="72" y1="136" x2="100" y2="162" stroke="white" stroke-width="3" stroke-opacity="0.75"/>
  <line x1="100" y1="162" x2="128" y2="136" stroke="white" stroke-width="3" stroke-opacity="0.55"/>
  <line x1="128" y1="136" x2="154" y2="162" stroke="white" stroke-width="3" stroke-opacity="0.55"/>
  <line x1="72" y1="136" x2="72" y2="76" stroke="white" stroke-width="2.5" stroke-opacity="0.55"/>
  <line x1="128" y1="136" x2="128" y2="76" stroke="white" stroke-width="2.5" stroke-opacity="0.4"/>
  <line x1="72" y1="76" x2="128" y2="76" stroke="white" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- Orbital ellipse -->
  <ellipse cx="100" cy="118" rx="60" ry="56" fill="none" stroke="white" stroke-width="1.8" stroke-dasharray="8 12" opacity="0.4"/>

  <!-- Center nucleus -->
  <circle cx="100" cy="136" r="10" fill="url(#g)"/>
  <circle cx="100" cy="136" r="5.5" fill="white" opacity="0.9"/>
  <circle cx="100" cy="136" r="3" fill="#c4b5fd"/>

  <!-- Orbital nodes -->
  <circle cx="46" cy="162" r="8" fill="none" stroke="white" stroke-width="3"/>
  <circle cx="72" cy="162" r="8" fill="none" stroke="white" stroke-width="3"/>
  <circle cx="128" cy="162" r="8" fill="none" stroke="white" stroke-width="3"/>
  <circle cx="154" cy="162" r="8" fill="none" stroke="white" stroke-width="3"/>
  <circle cx="72" cy="76" r="8" fill="none" stroke="white" stroke-width="3"/>
  <circle cx="128" cy="76" r="8" fill="none" stroke="white" stroke-width="3"/>
</svg>
