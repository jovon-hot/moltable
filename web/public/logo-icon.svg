<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <!-- Outer node connections — scaled in: 20→35, 200→175 -->
  <line x1="100" y1="65" x2="100" y2="35" stroke="white" stroke-width="3.5" stroke-opacity="0.95"/>
  <line x1="152" y1="95" x2="174" y2="78" stroke="white" stroke-width="3.5" stroke-opacity="0.95"/>
  <line x1="152" y1="133" x2="174" y2="150" stroke="white" stroke-width="3.5" stroke-opacity="0.95"/>
  <line x1="100" y1="163" x2="100" y2="175" stroke="white" stroke-width="3.5" stroke-opacity="0.95"/>
  <line x1="48" y1="133" x2="26" y2="150" stroke="white" stroke-width="3.5" stroke-opacity="0.95"/>
  <line x1="48" y1="95" x2="26" y2="78" stroke="white" stroke-width="3.5" stroke-opacity="0.95"/>

  <!-- Central hex ring -->
  <polygon points="100,65 152,95 152,133 100,163 48,133 48,95" fill="none" stroke="white" stroke-width="4" stroke-opacity="0.95"/>

  <!-- Inner star lines -->
  <line x1="100" y1="65" x2="100" y2="163" stroke="white" stroke-width="2.5" stroke-opacity="0.5"/>
  <line x1="48" y1="95" x2="152" y2="133" stroke="white" stroke-width="2.5" stroke-opacity="0.5"/>
  <line x1="152" y1="95" x2="48" y2="133" stroke="white" stroke-width="2.5" stroke-opacity="0.5"/>

  <!-- Center point -->
  <circle cx="100" cy="114" r="6.5" fill="url(#grad)"/>
  <circle cx="100" cy="114" r="3" fill="white"/>

  <!-- Outer nodes -->
  <circle cx="100" cy="35" r="7.5" fill="none" stroke="white" stroke-width="3.5"/>
  <circle cx="174" cy="78" r="7.5" fill="none" stroke="white" stroke-width="3.5"/>
  <circle cx="174" cy="150" r="7.5" fill="none" stroke="white" stroke-width="3.5"/>
  <circle cx="100" cy="175" r="7.5" fill="none" stroke="white" stroke-width="3.5"/>
  <circle cx="26" cy="150" r="7.5" fill="none" stroke="white" stroke-width="3.5"/>
  <circle cx="26" cy="78" r="7.5" fill="none" stroke="white" stroke-width="3.5"/>

  <!-- Inner hex nodes -->
  <circle cx="100" cy="65" r="5" fill="white"/>
  <circle cx="152" cy="95" r="5" fill="white"/>
  <circle cx="152" cy="133" r="5" fill="white"/>
  <circle cx="100" cy="163" r="5" fill="white"/>
  <circle cx="48" cy="133" r="5" fill="white"/>
  <circle cx="48" cy="95" r="5" fill="white"/>
</svg>
