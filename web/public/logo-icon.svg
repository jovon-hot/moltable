<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Bottom connecting bonds -->
  <line x1="46" y1="162" x2="72" y2="136" stroke="#a78bfa" stroke-width="2.5" stroke-opacity="0.8"/>
  <line x1="72" y1="136" x2="100" y2="162" stroke="#a78bfa" stroke-width="2.5" stroke-opacity="0.8"/>
  <line x1="100" y1="162" x2="128" y2="136" stroke="#a78bfa" stroke-width="2.5" stroke-opacity="0.6"/>
  <line x1="128" y1="136" x2="154" y2="162" stroke="#a78bfa" stroke-width="2.5" stroke-opacity="0.6"/>
  <!-- Vertical bonds -->
  <line x1="72" y1="136" x2="72" y2="76" stroke="#a78bfa" stroke-width="2.2" stroke-opacity="0.6"/>
  <line x1="128" y1="136" x2="128" y2="76" stroke="#a78bfa" stroke-width="2.2" stroke-opacity="0.5"/>
  <!-- Top bond -->
  <line x1="72" y1="76" x2="128" y2="76" stroke="#a78bfa" stroke-width="2.2" stroke-opacity="0.5"/>
  <!-- Orbital ellipse -->
  <ellipse cx="100" cy="118" rx="60" ry="56" fill="none" stroke="#a78bfa" stroke-width="1.4" stroke-dasharray="7 10" opacity="0.45"/>
  <!-- Center nucleus -->
  <circle cx="100" cy="136" r="9" fill="url(#g)"/>
  <circle cx="100" cy="136" r="5" fill="#a78bfa"/>
  <circle cx="100" cy="136" r="2.5" fill="#fff" opacity="0.95"/>
  <!-- Orbital nodes -->
  <circle cx="46" cy="162" r="7" fill="none" stroke="#a78bfa" stroke-width="2.8"/>
  <circle cx="72" cy="162" r="7" fill="none" stroke="#a78bfa" stroke-width="2.8"/>
  <circle cx="128" cy="162" r="7" fill="none" stroke="#a78bfa" stroke-width="2.8"/>
  <circle cx="154" cy="162" r="7" fill="none" stroke="#a78bfa" stroke-width="2.8"/>
  <circle cx="72" cy="76" r="7" fill="none" stroke="#a78bfa" stroke-width="2.8"/>
  <circle cx="128" cy="76" r="7" fill="none" stroke="#a78bfa" stroke-width="2.8"/>
</svg>
