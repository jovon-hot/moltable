<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7170ff"/>
      <stop offset="100%" stop-color="#4f4ecf"/>
    </linearGradient>
  </defs>

  <!-- Logo mark (larger scale, bolder strokes) -->
  <g transform="translate(50,50) scale(0.72) translate(-100,-100)">
    <!-- Bottom connecting lines -->
    <line x1="46" y1="162" x2="72" y2="136" stroke="#7170ff" stroke-width="2.2" stroke-opacity="0.7"/>
    <line x1="72" y1="136" x2="100" y2="162" stroke="#7170ff" stroke-width="2.2" stroke-opacity="0.7"/>
    <line x1="100" y1="162" x2="128" y2="136" stroke="#9d9cff" stroke-width="2.2" stroke-opacity="0.55"/>
    <line x1="128" y1="136" x2="154" y2="162" stroke="#9d9cff" stroke-width="2.2" stroke-opacity="0.55"/>
    <!-- Vertical connecting lines -->
    <line x1="72" y1="136" x2="72" y2="76" stroke="#7170ff" stroke-width="2.0" stroke-opacity="0.55"/>
    <line x1="128" y1="136" x2="128" y2="76" stroke="#9d9cff" stroke-width="2.0" stroke-opacity="0.45"/>
    <!-- Top connecting line -->
    <line x1="72" y1="76" x2="128" y2="76" stroke="#7170ff" stroke-width="2.0" stroke-opacity="0.45"/>
    <!-- Orbital ring -->
    <ellipse cx="100" cy="118" rx="60" ry="56" fill="none" stroke="#7170ff" stroke-width="1.2" stroke-dasharray="6 8" opacity="0.4"/>
    <!-- Center core -->
    <circle cx="100" cy="136" r="8" fill="url(#g)"/>
    <circle cx="100" cy="136" r="4.5" fill="#7170ff"/>
    <circle cx="100" cy="136" r="2.2" fill="#f7f8f8" opacity="0.9"/>
    <!-- Orbital nodes -->
    <circle cx="46" cy="162" r="6" fill="none" stroke="#7170ff" stroke-width="2.5"/>
    <circle cx="72" cy="162" r="6" fill="none" stroke="#7170ff" stroke-width="2.5"/>
    <circle cx="128" cy="162" r="6" fill="none" stroke="#9d9cff" stroke-width="2.5"/>
    <circle cx="154" cy="162" r="6" fill="none" stroke="#9d9cff" stroke-width="2.5"/>
    <circle cx="72" cy="76" r="6" fill="none" stroke="#7170ff" stroke-width="2.5"/>
    <circle cx="128" cy="76" r="6" fill="none" stroke="#9d9cff" stroke-width="2.5"/>
  </g>

  <!-- Wordmark -->
  <text x="125" y="56" font-family="Inter, system-ui, -apple-system, sans-serif"
    font-weight="620" font-size="28" letter-spacing="-0.5px" fill="#f7f8f8">Moltable</text>

  <!-- Tagline -->
  <text x="125" y="73" font-family="Inter, system-ui, -apple-system, sans-serif"
    font-weight="400" font-size="10" letter-spacing="2.5px" fill="#7170ff">AI IDENTITY SYNC</text>
</svg>
