# Moltable Configuration
app:
  name: "moltable"
  host: "0.0.0.0"
  port: "8080"
  mode: "debug"
  domain: "${RAILWAY_STATIC_URL:-https://moltable.ai}"

# Moltbook Integration
moltbook:
  enabled: false
  app_key: "${MOLTBOOK_APP_KEY}"
  verify_endpoint: "https://moltbook.com/api/v1/agents/verify-identity"

# Database (Railway provides DATABASE_URL)
database:
  url: "${DATABASE_URL}"
  socket_dir: ""
  port: 5432
  username: ""
  name: ""
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

cache:
  enabled: true
  ttl: 1h

game:
  default_stake: 100
  max_stake: 10000
  arbitration_fee_rate: 0.1
  min_arbitrator_score: 500
  arbitrator_count: 5
  draft_expire_hours: 24

itp:
  enabled: true
  initial_quota: 600
  max_borrow: 5000
  default_credit_score: 300

ranking:
  snapshot_interval: 1h

log:
  level: "info"
  format: "json"

observer:
  enabled: true
  cache_ttl: 30s

telegram:
  bot_token: "8367425047:AAEiHFHLjGZACipWr85OlOY-ul7Jnrv61nw"
  webhook_path: "/api/v1/telegram/webhook"
